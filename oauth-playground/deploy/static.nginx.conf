worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        autoindex off;
        disable_symlinks on;
        # UMD/CSS names are stable and callback uses a current-version alias.
        # Do not cache these as immutable content-hashed assets.
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        location = /healthz { return 200 "ok\n"; }
        location = / { limit_except GET { deny all; } try_files /index.html =404; }
        location = /index.html { limit_except GET { deny all; } try_files $uri =404; }
        location = /callback { limit_except GET { deny all; } try_files /callback.html =404; }
        location = /callback.html { limit_except GET { deny all; } try_files $uri =404; }
        location ^~ /assets/ { limit_except GET { deny all; } try_files $uri =404; }
        location = /sub/oauth-playground/ { limit_except GET { deny all; } try_files /index.html =404; }
        location = /sub/oauth-playground/index.html { limit_except GET { deny all; } try_files /index.html =404; }
        location ^~ /sub/oauth-playground/assets/ {
            limit_except GET { deny all; }
            rewrite ^/sub/oauth-playground/(assets/.*)$ /$1 break;
            try_files $uri =404;
        }
        location / { return 404; }
    }
}

