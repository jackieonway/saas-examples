name: Example CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  independent-oidc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm --prefix oidc-rp ci --ignore-scripts
      - run: npm --prefix oidc-rp run check
      - run: npm --prefix oidc-rp test
      - run: npm --prefix oidc-rp audit --omit=dev
  frontends:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm --prefix micro-vue ci && npm --prefix micro-jquery ci && npm --prefix report-center ci && npm --prefix websocket ci
      - run: node scripts/check-inputs.mjs
      - run: node --test scripts/verify-delivery.test.mjs scripts/build-provenance.test.mjs
      - run: npm --prefix micro-vue run build && npm --prefix micro-jquery run build && npm --prefix report-center run build && npm --prefix websocket run build
      - run: node scripts/verify-delivery.mjs
      - run: npm --prefix micro-vue test && npm --prefix micro-jquery test && npm --prefix report-center test && npm --prefix websocket test
      - run: node scripts/package-candidates.mjs ci-candidate
      - run: node scripts/verify-candidate.mjs artifacts/candidates/ci-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: qiankun-example-candidates
          path: artifacts/candidates/ci-candidate
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path websocket/backend/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path websocket/backend/Cargo.toml
