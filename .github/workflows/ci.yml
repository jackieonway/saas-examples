name: Example CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontends:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm run install:all
      - run: npm run deps:check
      - run: npm run build
      - run: npm test
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path oauth-playground/backend/Cargo.toml -- --check
      - run: cargo fmt --manifest-path websocket/backend/Cargo.toml -- --check
      - run: npm run test:rust
