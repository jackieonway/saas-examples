name: Example CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  frontends:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@11.16.0
      - run: npm --prefix micro-vue ci && npm --prefix micro-jquery ci && npm --prefix websocket ci && npm --prefix oauth-playground/frontend ci
      - run: node scripts/check-inputs.mjs
      - run: npm --prefix micro-vue run build && npm --prefix micro-jquery run build && npm --prefix websocket run build && npm --prefix oauth-playground/frontend run build
      - run: npm --prefix micro-vue test && npm --prefix micro-jquery test && npm --prefix websocket test && node --test oauth-playground/frontend/tests/*.test.mjs oauth-playground/tests/delivery.mjs
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --manifest-path oauth-playground/backend/Cargo.toml -- --check
      - run: cargo fmt --manifest-path websocket/backend/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path oauth-playground/backend/Cargo.toml && cargo test --locked --manifest-path websocket/backend/Cargo.toml
